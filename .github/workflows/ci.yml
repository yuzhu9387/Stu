name: CI

# Pull requests run the checks; a push to main runs them through deploy.yml
# before anything is released.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # Cloud SQL runs PostgreSQL 16
        env:
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: recipe
          POSTGRES_DB: recipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipe -d recipe"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RECIPE_AGENT_TEST_DATABASE_URL: postgresql+asyncpg://recipe:recipe@localhost:5432/recipe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check src tests migrations
      - run: uv run ruff check src tests migrations
      - run: uv run mypy src
      - run: uv run pytest
      - name: Migrations apply to an empty PostgreSQL database
        run: |
          PGPASSWORD=recipe psql -h localhost -U recipe -d recipe -c "CREATE DATABASE migration_check"
          RECIPE_AGENT_DATABASE_URL=postgresql+asyncpg://recipe:recipe@localhost:5432/migration_check uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - name: Cloudflare Worker
        run: node --test deploy/cloudflare/proxy.test.mjs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recipe
          POSTGRES_PASSWORD: recipe
          POSTGRES_DB: recipe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipe -d recipe"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # The runner makes and drops its own database next to this one.
      RECIPE_AGENT_E2E_DATABASE_ADMIN_URL: postgresql://recipe:recipe@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: uv run python scripts/run-kitchen-e2e.py
