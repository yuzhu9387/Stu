name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check src tests migrations
      - run: uv run ruff check src tests migrations
      - run: uv run mypy src
      - run: uv run pytest
      - run: RECIPE_AGENT_DATABASE_URL=sqlite:////tmp/migrations.db uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web exec playwright test tests/e2e/core-flow.spec.ts

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml build api worker web
