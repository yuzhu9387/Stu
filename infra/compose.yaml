name: family-recipe-agent

services:
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      RECIPE_AGENT_DATABASE_URL: postgresql+asyncpg://recipe:recipe@postgres:5432/recipe
      RECIPE_AGENT_ENVIRONMENT: development
      RECIPE_AGENT_METRICS_TOKEN: development-only-metrics-token
      RECIPE_AGENT_SESSION_SIGNING_KEY: development-only-session-key
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      RECIPE_AGENT_DATABASE_URL: postgresql+asyncpg://recipe:recipe@postgres:5432/recipe
      RECIPE_AGENT_ENVIRONMENT: development
      RECIPE_AGENT_METRICS_TOKEN: development-only-metrics-token
      RECIPE_AGENT_REDIS_URL: redis://redis:6379/0
      RECIPE_AGENT_SESSION_SIGNING_KEY: development-only-session-key
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      RECIPE_AGENT_DATABASE_URL: postgresql+asyncpg://recipe:recipe@postgres:5432/recipe
      RECIPE_AGENT_ENVIRONMENT: development
      RECIPE_AGENT_METRICS_TOKEN: development-only-metrics-token
      RECIPE_AGENT_REDIS_URL: redis://redis:6379/0
      RECIPE_AGENT_SESSION_SIGNING_KEY: development-only-session-key
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: recipe
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: recipe
      MINIO_ROOT_PASSWORD: development-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 recipe development-minio-secret &&
        mc mb --ignore-existing local/recipe-agent &&
        mc anonymous set none local/recipe-agent

volumes:
  postgres-data:
  redis-data:
  minio-data:
